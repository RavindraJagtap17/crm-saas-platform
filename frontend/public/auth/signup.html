<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Start your agency · CRM</title>
  <link rel="stylesheet" href="../../src/css/tokens.css" />
  <link rel="stylesheet" href="../../src/css/base.css" />
  <link rel="stylesheet" href="../../src/css/components.css" />
  <link rel="stylesheet" href="../../src/css/layout.css" />
  <script src="../../config.js"></script>
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-mark" aria-hidden="true">C</div>
        <h1 class="auth-title">Start your agency</h1>
        <p class="auth-subtitle">Sign up with Google to create your agency and become its Agency Admin</p>
      </div>

      <div class="card card-pad">
        <div id="alert-slot"></div>
        <div class="field">
          <label class="label" for="su-agency-name">Agency name</label>
          <input class="input" id="su-agency-name" placeholder="Acme Marketing Agency" />
          <div class="field-error" id="su-name-error" hidden></div>
        </div>
        <div class="gsi-slot" id="gsi-button"></div>
        <div id="gsi-fallback-note" class="hint" style="text-align:center;margin-top:var(--space-3);display:none">
          Google Sign-In isn't configured for this environment yet (no <code>GOOGLE_CLIENT_ID</code> set).
        </div>
        <p class="hint" style="text-align:center;margin-top:var(--space-3)">
          You'll set up payment for your agency's subscription right after this.
        </p>
      </div>

      <div id="dev-note-slot"></div>

      <p class="auth-footer">
        Already have an account? <a href="./index.html">Sign in</a>
      </p>
    </div>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="../../src/js/pages/auth-signup.js"></script>
</body>
</html>
